services:

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    command: >
      --port=3306
      --innodb-strict-mode=1
      --innodb-buffer-pool-size=256M
      --transaction-isolation=READ-COMMITTED
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=512
      --innodb-rollback-on-timeout=OFF
      --innodb-lock-wait-timeout=120
    volumes:
      - mariadb_data:/var/lib/mysql:z
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_INITDB_SKIP_TZINFO: "1"
      MARIADB_DATABASE: "photoprism"
      MARIADB_USER: "photoprism"
      MARIADB_PASSWORD: "photoprism"
      MARIADB_ROOT_PASSWORD: "photoprism"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  ## Frontend — webpack in watch mode
  ## Reads from frontend/src/, writes built assets to assets/static/build/.

  ## Mokosh backend — runs via `go run`, no binary compilation needed
  mokosh:
    build:
      context: .
      dockerfile: Dockerfile_scratch
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "2342:2342"
    working_dir: /go/src/github.com/photoprism/photoprism
    environment:
      PHOTOPRISM_ADMIN_USER: "admin"
      PHOTOPRISM_ADMIN_PASSWORD: "photoprism"
      PHOTOPRISM_AUTH_MODE: "password"
      PHOTOPRISM_SITE_URL: "http://${HOST_IP:-localhost}:2342/"
      PHOTOPRISM_SITE_CAPTION: "AI-Powered Photos App"
      PHOTOPRISM_DEBUG: "true"
      PHOTOPRISM_LOG_LEVEL: "debug"
      PHOTOPRISM_READONLY: "false"
      PHOTOPRISM_EXPERIMENTAL: "true"
      PHOTOPRISM_HTTP_MODE: "debug"
      PHOTOPRISM_HTTP_HOST: "0.0.0.0"
      PHOTOPRISM_HTTP_PORT: "2342"
      PHOTOPRISM_HTTP_COMPRESSION: "none"
      PHOTOPRISM_DATABASE_DRIVER: "mysql"
      PHOTOPRISM_DATABASE_SERVER: "mariadb:3306"
      PHOTOPRISM_DATABASE_NAME: "photoprism"
      PHOTOPRISM_DATABASE_USER: "photoprism"
      PHOTOPRISM_DATABASE_PASSWORD: "photoprism"
      PHOTOPRISM_STORAGE_PATH: "/photoprism/storage"
      PHOTOPRISM_ORIGINALS_PATH: "/photoprism/storage/originals"
      PHOTOPRISM_IMPORT_PATH: "/photoprism/storage/import"
      # Points into the shared source mount so the backend serves live-built assets.
      PHOTOPRISM_ASSETS_PATH: "/go/src/github.com/photoprism/photoprism/assets"
      PHOTOPRISM_CORS_ORIGIN: "*"
      PHOTOPRISM_CORS_HEADERS: "Authorization,X-Auth-Token,X-Client-Uri,X-Client-Version,Content-Type"
      PHOTOPRISM_CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS,HEAD"
      ## S3 / object storage (leave bucket name empty to use local storage)
      PHOTOPRISM_S3_FILES_BUCKET_NAME: "${PHOTOPRISM_S3_FILES_BUCKET_NAME:-}"
      PHOTOPRISM_AWS_ACCESS_KEY_ID: "${PHOTOPRISM_AWS_ACCESS_KEY_ID:-}"
      PHOTOPRISM_AWS_SECRET_ACCESS_KEY: "${PHOTOPRISM_AWS_SECRET_ACCESS_KEY:-}"
      PHOTOPRISM_AWS_REGION: "${PHOTOPRISM_AWS_REGION:-us-east-1}"
      PHOTOPRISM_AWS_BASE_ENDPOINT: "${PHOTOPRISM_AWS_BASE_ENDPOINT:-}"
      PHOTOPRISM_DISABLE_CHOWN: "false"
      PHOTOPRISM_DISABLE_BACKUPS: "false"
      PHOTOPRISM_DISABLE_WEBDAV: "false"
      PHOTOPRISM_DISABLE_SETTINGS: "false"
      PHOTOPRISM_DISABLE_TENSORFLOW: "true"
      PHOTOPRISM_DISABLE_PLACES: "false"
      PHOTOPRISM_DISABLE_EXIFTOOL: "false"
      PHOTOPRISM_DETECT_NSFW: "false"
      PHOTOPRISM_UPLOAD_NSFW: "true"
      PHOTOPRISM_THUMB_UNCACHED: "true"
      PHOTOPRISM_THUMB_SIZE: "1920"
      PHOTOPRISM_THUMB_SIZE_UNCACHED: "7680"
      PHOTOPRISM_JPEG_SIZE: "7680"
      TF_CPP_MIN_LOG_LEVEL: "1"

volumes:
  mariadb_data: